<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0F1E"/>
      <stop offset="100%" style="stop-color:#0D1B3E"/>
    </linearGradient>

    <!-- Green glow gradient for chart -->
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF87;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00FF87;stop-opacity:0"/>
    </linearGradient>

    <!-- Telegram blue gradient -->
    <linearGradient id="teleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#29B6F6"/>
      <stop offset="100%" style="stop-color:#0277BD"/>
    </linearGradient>

    <!-- Outer ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF87"/>
      <stop offset="50%" style="stop-color:#29B6F6"/>
      <stop offset="100%" style="stop-color:#00FF87"/>
    </linearGradient>

    <!-- Glow filter for chart line -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow filter for ring -->
    <filter id="glowRing" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow for disc -->
    <filter id="discShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#00FF87" flood-opacity="0.3"/>
    </filter>

    <!-- Clip chart to circle area -->
    <clipPath id="circleClip">
      <circle cx="200" cy="185" r="110"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#00FF87" stroke-width="1">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>

  <!-- Outer glowing ring -->
  <circle cx="200" cy="185" r="138" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.6" filter="url(#glowRing)"/>
  
  <!-- Dashed outer ring decoration -->
  <circle cx="200" cy="185" r="148" fill="none" stroke="#00FF87" stroke-width="1" stroke-dasharray="6 10" opacity="0.2"/>

  <!-- Main disc -->
  <circle cx="200" cy="185" r="118" fill="url(#bgGrad)" filter="url(#discShadow)"/>
  <circle cx="200" cy="185" r="118" fill="#0E1A35"/>

  <!-- Chart fill area (clipped) -->
  <g clip-path="url(#circleClip)">
    <polygon
      points="90,230 115,210 140,220 165,185 190,195 215,160 240,148 265,130 290,110 290,270 90,270"
      fill="url(#chartGrad)"
      opacity="0.18"
    />
    <!-- Chart line -->
    <polyline
      points="90,230 115,210 140,220 165,185 190,195 215,160 240,148 265,130 290,110"
      fill="none"
      stroke="#00FF87"
      stroke-width="3"
      stroke-linejoin="round"
      stroke-linecap="round"
      filter="url(#glowGreen)"
    />
    <!-- Data dots -->
    <circle cx="90" cy="230" r="3.5" fill="#00FF87" opacity="0.6"/>
    <circle cx="140" cy="220" r="3.5" fill="#00FF87" opacity="0.6"/>
    <circle cx="190" cy="195" r="3.5" fill="#00FF87" opacity="0.6"/>
    <circle cx="240" cy="148" r="3.5" fill="#00FF87" opacity="0.6"/>
    <circle cx="290" cy="110" r="4.5" fill="#00FF87"/>
    <!-- Highlight last point -->
    <circle cx="290" cy="110" r="8" fill="none" stroke="#00FF87" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Telegram paper plane icon overlay (bottom-right of disc) -->
  <g transform="translate(270, 240)" opacity="0.9">
    <circle cx="0" cy="0" r="22" fill="url(#teleGrad)"/>
    <!-- Paper plane shape -->
    <path d="M-10,0 L13,-7 L6,12 L0,5 Z" fill="white" opacity="0.95"/>
    <path d="M0,5 L6,12 L9,3" fill="white" opacity="0.7"/>
  </g>

  <!-- Bot label badge -->
  <g transform="translate(200, 88)">
    <rect x="-30" y="-12" width="60" height="22" rx="11" fill="#00FF87" opacity="0.12"/>
    <rect x="-30" y="-12" width="60" height="22" rx="11" fill="none" stroke="#00FF87" stroke-width="1" opacity="0.4"/>
    <text x="0" y="5" font-family="'Courier New', monospace" font-size="10" fill="#00FF87" text-anchor="middle" letter-spacing="2" font-weight="bold">BOT</text>
  </g>

  <!-- Logo text -->
  <text x="200" y="338"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="22"
    font-weight="bold"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="4">
    STOCKBOT
  </text>

  <!-- Tagline -->
  <text x="200" y="360"
    font-family="'Courier New', monospace"
    font-size="10"
    fill="#29B6F6"
    text-anchor="middle"
    letter-spacing="3"
    opacity="0.8">
    TRACK · ALERT · PROFIT
  </text>

  <!-- Corner decorations -->
  <g opacity="0.15" stroke="#00FF87" stroke-width="1" fill="none">
    <polyline points="20,20 20,35 35,35"/>
    <polyline points="380,20 380,35 365,35"/>
    <polyline points="20,380 20,365 35,365"/>
    <polyline points="380,380 380,365 365,365"/>
  </g>
</svg>
